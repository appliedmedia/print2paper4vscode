<svg width="16" height="16" viewBox="2.65 3.15 18.7 18.7" fill="none" stroke="#c5c5c5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
  <!-- input paper feeding in at the top (same width as the output sheet) -->
  <path d="M8 7.5 V5 H16 V7.5" />
  <!-- printer body; bottom edge breaks where the sheet passes through in front -->
  <path d="M5 7.5 H19 A1.5 1.5 0 0 1 20.5 9 V12.5 A1.5 1.5 0 0 1 19 14 H16 M8 14 H5 A1.5 1.5 0 0 1 3.5 12.5 V9 A1.5 1.5 0 0 1 5 7.5" />
  <!-- power light in the upper corner of the printer box -->
  <circle cx="18" cy="9.3" r="0.9" fill="#c5c5c5" stroke="none" />
  <!-- output slot: 1px wider than the sheet on each side -->
  <path d="M7 11.5 H17" />
  <!-- printed sheet in front of the box; square corners, open top (the slot) -->
  <path d="M8 11.5 V20 H16 V11.5" />
  <!-- three code lines: dash-dot, dot-dash, dash-dash -->
  <path d="M9.9 14 H15.1" stroke-dasharray="2.2 1.6 0.1 1.6" />
  <path d="M9.9 16 H14.4" stroke-dasharray="0.1 1.6 2.2 1.6" />
  <path d="M9.9 18 H13.8" stroke-dasharray="1.24 1.6" />
</svg>
